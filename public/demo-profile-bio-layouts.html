<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile 簡介區塊 Demo（離線）</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { padding: 1.25rem; }
    .demo-wrap { max-width: 1100px; margin: 0 auto; }

    .controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .controls label { font-weight: 800; color: var(--text-color); font-size: 0.95rem; }
    .controls select {
      padding: 0.6rem 0.85rem;
      border-radius: 0.75rem;
      border: 1.5px solid var(--border-color);
      background: var(--bg-light);
      color: var(--text-color);
      font-weight: 800;
      cursor: pointer;
      outline: none;
    }
    .controls .btn-toggle {
      padding: 0.6rem 0.9rem;
      border-radius: 0.75rem;
      border: 1.5px solid var(--border-color);
      background: var(--bg-light);
      color: var(--text-color);
      font-weight: 800;
      cursor: pointer;
    }

    .profile-card {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: var(--shadow-lg);
      position: relative;
    }
    .profile-gradient {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      border-radius: 1rem 1rem 0 0;
      background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 50%, #4f46e5 100%);
    }

    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 0.25rem;
    }

    .left-block { flex: 1; min-width: 260px; }
    .right-block { min-width: 290px; }

    .avatar-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .avatar-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid var(--primary-color);
      display: grid;
      place-items: center;
      font-size: 2rem;
      background: linear-gradient(135deg, rgba(102,126,234,0.18), rgba(118,75,162,0.18));
    }
    .avatar-meta h1 { margin: 0 0 0.5rem; font-size: 2rem; }
    .region-row {
      font-size: 0.88rem;
      color: var(--text-light);
      margin-bottom: 0.5rem;
    }
    .social-links-inline { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
    .chip {
      border: 1px solid var(--border-color);
      background: var(--bg-light);
      border-radius: 999px;
      padding: 0.25rem 0.55rem;
      font-weight: 800;
      color: var(--text-light);
      font-size: 0.78rem;
      white-space: nowrap;
    }

    .mbti-row {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 0.25rem;
    }
    .mbti-tag {
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      user-select: none;
    }
    .mbti-name { color: var(--text-light); font-weight: 800; }

    .created-at { color: var(--text-light); margin-top: 0.25rem; font-size: 0.9rem; }

    /* ===== bio card (這就是你要調的「簡介」區塊）===== */
    .bio-card {
      margin-top: 0.4rem;
      padding: 0.6rem 0.8rem;
      background: var(--bg-color);
      border-radius: 0.5rem;
      border-left: 3px solid var(--primary-color);
      color: var(--text-color);
      font-size: 0.95rem;
      line-height: 1.6;
      display: none;
    }
    .bio-card.show { display: block; }

    /* right block: 只做占位，避免你在討論 bio 時被按鈕/偏好干擾 */
    .actions-row {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .actions-row .btn-lite {
      padding: 0.7rem 1rem;
      border-radius: 0.75rem;
      border: 1.5px solid var(--border-color);
      background: var(--bg-light);
      color: var(--text-color);
      font-weight: 900;
      text-align: left;
    }

    /* ================== Layout variants ================== */
    /* 201：目前風格（bio 在 created-at 下方、固定 margin-top） */
    .layout-201 .bio-card { margin-top: 0.4rem; }
    .layout-201 .profile-header { justify-content: space-between; }

    /* 202：bio 與 created-at 更貼（縮小 margin）+ 適度減 padding */
    .layout-202 .bio-card { margin-top: 0.15rem; padding: 0.5rem 0.75rem; }

    /* 203：bio 靠近 MBTI 列（把 bio 向上吃掉一點空間，視覺上更緊湊） */
    .layout-203 .bio-card { margin-top: 0.15rem; }
    .layout-203 .created-at { margin-top: 0.05rem; }
    .layout-203 .avatar-row { margin-bottom: 0.75rem; }

    /* 204：bio 全寬跨兩欄（在右側區塊下方，讓長文字更好呈現） */
    .layout-204 .profile-header { gap: 0.75rem; }
    .layout-204 .right-block { min-width: 250px; flex: 0 0 320px; }
    .layout-204 .bio-card { width: 100%; margin-top: 0.75rem; }
    .layout-204 .profile-card { }
    .layout-204 .left-block { flex: 1 1 520px; }

    /* 205：手機友善（右欄在下、bio 保持一致間距，主要是視覺比例） */
    .layout-205 .profile-header { flex-direction: column; align-items: stretch; }
    .layout-205 .right-block { min-width: 0; }
    .layout-205 .bio-card { margin-top: 0.35rem; }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <div class="controls">
      <label for="layoutSel">Profile 簡介排版（只調 bio 區塊）</label>
      <select id="layoutSel">
        <option value="201">⑵ 201：目前風格（基準）</option>
        <option value="202">⑵ 202：bio 更貼、padding 輕微縮</option>
        <option value="203">⑵ 203：往上靠近 MBTI</option>
        <option value="204">⑵ 204：bio 全寬跨兩欄</option>
        <option value="205">⑵ 205：手機友善（右欄下移）</option>
      </select>
      <button class="btn-toggle" id="btnToggleBio" type="button">切換顯示/隱藏 bio</button>
    </div>

    <section class="profile-card layout-201" id="preview">
      <div class="profile-gradient"></div>

      <div class="profile-header">
        <div class="left-block">
          <div class="avatar-row">
            <div class="avatar-circle">🎯</div>
            <div class="avatar-meta">
              <h1>仲軒</h1>
              <div class="region-row">台灣 • 台北 / 想找桌友</div>
              <div class="social-links-inline">
                <span class="chip" style="border-color: rgba(124,58,237,0.3); background: rgba(124,58,237,0.15); color: var(--primary-color);">IG</span>
                <span class="chip" style="border-color: rgba(59,130,246,0.25); background: rgba(59,130,246,0.10); color: var(--primary-color);">Discord</span>
              </div>
              <div class="mbti-row">
                <div class="mbti-tag">🎭 INTJ<span style="display:none;">🔒</span></div>
                <div class="mbti-name">建築師</div>
              </div>
              <div class="created-at">加入於 2026/03/18</div>
            </div>
          </div>

          <p class="bio-card show" id="bioCardDemo">
            目前狀態：只要好玩就行。喜歡策略與合作，也願意在局末一起複盤。<br>
            目前最常玩的類型是：輕策略卡牌、合作桌遊，偶爾也會來一局劇本推理。
          </p>
        </div>

        <div class="right-block">
          <div class="actions-row">
            <div class="btn-lite">🧪 桌友適性測驗（占位）</div>
            <div class="btn-lite">📝 編輯簡介（占位）</div>
            <div class="btn-lite">✏️ 編輯桌遊（占位）</div>
          </div>
          <!-- 不放偏好/發散條，避免你在挑 bio 的時候被其它東西干擾 -->
        </div>
      </div>
    </section>
  </div>

  <script>
    (function () {
      'use strict';
      var sel = document.getElementById('layoutSel');
      var preview = document.getElementById('preview');
      var btn = document.getElementById('btnToggleBio');
      var bio = document.getElementById('bioCardDemo');

      function setLayout(val) {
        preview.className = preview.className.replace(/\\blayout-\\d+\\b/g, ' ').trim();
        preview.classList.add('layout-' + val);
      }

      sel.addEventListener('change', function () {
        setLayout(sel.value);
      });

      btn.addEventListener('click', function () {
        bio.classList.toggle('show');
      });
    })();
  </script>
</body>
</html>
