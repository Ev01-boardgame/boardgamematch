<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tier Maker V3 · 模擬 D1 + 存檔（離線）</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        .page { max-width: 960px; margin: 0 auto; padding: 1rem 1rem 3rem; }
        .panel {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 0.75rem;
            padding: 0.85rem 1rem; margin-bottom: 1rem; font-size: 0.85rem;
        }
        .panel pre {
            margin: 0.5rem 0 0; padding: 0.6rem; background: rgba(0,0,0,0.06); border-radius: 0.5rem;
            overflow: auto; max-height: 140px; font-size: 0.72rem; line-height: 1.4;
        }
        .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.75rem; align-items: center; }
        .toolbar button, .toolbar a {
            padding: 0.4rem 0.75rem; border-radius: 0.5rem; border: 1px solid var(--border-color);
            background: var(--bg-color); color: var(--text-color); cursor: pointer; font-size: 0.85rem; text-decoration: none;
        }
        .toolbar .primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: #fff; border: none; font-weight: 600;
        }
        .layout { display: grid; gap: 1rem; }
        @media (min-width: 800px) { .layout { grid-template-columns: 240px 1fr; } }
        .pool {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 0.75rem;
            padding: 0.75rem; max-height: 380px; overflow: auto;
        }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip {
            padding: 0.35rem 0.55rem; border-radius: 999px; font-size: 0.78rem; cursor: grab;
            background: rgba(99,102,241,0.15); border: 1px solid rgba(99,102,241,0.35); color: var(--text-color);
            max-width: 100%;
        }
        .chip.meta { border-style: dashed; opacity: 0.95; }
        #export-root { background: #1e1e2e; border-radius: 0.75rem; padding: 0.75rem; }
        .tier-row { display: flex; min-height: 68px; margin-bottom: 6px; border-radius: 6px; overflow: hidden; }
        .tier-label {
            width: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 1.05rem; color: #111;
        }
        .tier-zone {
            flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; padding: 8px;
            min-height: 52px; background: rgba(0,0,0,0.2);
        }
        .tier-zone .chip {
            padding: 0.35rem 0.55rem; border-radius: 8px; cursor: grab; font-size: 0.78rem;
            background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.28); color: #f1f5f9;
            max-width: 200px;
        }
        .tier-row.drag-target .tier-zone { outline: 2px dashed rgba(255,255,255,0.45); }
        input[type="text"] {
            width: 100%; padding: 0.35rem 0.5rem; border-radius: 0.5rem; border: 1px solid var(--border-color);
            margin-bottom: 6px; box-sizing: border-box;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">
                <div class="navbar-logo-text" style="display:flex;flex-direction:column;line-height:1.3;">
                    <span style="display:block;font-size:1.1rem;font-weight:700;">MBTI ×</span>
                    <span style="display:block;font-size:1.1rem;font-weight:700;">桌遊配對</span>
                </div>
            </a>
            <ul class="navbar-menu">
                <li><a href="demo-tier-maker-hub.html">示範總覽</a></li>
            </ul>
        </div>
    </nav>
    <div class="page">
        <h1 style="font-size:1.25rem;margin-bottom:0.35rem;">V3 · 模擬 D1 API + localStorage</h1>
        <p style="color:var(--text-light);font-size:0.9rem;margin-bottom:0.75rem;">
            「載入模擬資料」= 未來 <code>/api/me/games</code> 回傳的精簡形狀；存檔用 <code>localStorage</code> 模擬使用者偏好同步。
        </p>
        <div class="panel">
            <strong>模擬回應預覽</strong>（之後可換成真 Worker + D1）
            <pre id="jsonPreview">{}</pre>
        </div>
        <div class="toolbar">
            <button type="button" class="primary" id="btnMock">載入模擬 D1 資料</button>
            <button type="button" id="btnSave">存到本機（localStorage）</button>
            <button type="button" id="btnLoad">從本機還原</button>
            <button type="button" id="btnExport">匯出 Tier PNG</button>
            <a href="demo-tier-maker-hub.html">← 總覽</a>
        </div>
        <div class="layout">
            <div class="pool">
                <div style="font-size:0.8rem;color:var(--text-light);margin-bottom:0.35rem;">池子（可拖回此處）</div>
                <input type="text" id="manual" placeholder="手動加入遊戲名…">
                <button type="button" id="btnAdd" style="width:100%;margin-bottom:8px;padding:0.35rem;">加入池</button>
                <div class="chips" id="pool"></div>
            </div>
            <div>
                <div id="export-root">
                    <div id="tierRows"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const LS_KEY = 'demo-tier-maker-v3-state';
        const TIERS = ['S','A','B','C','D','F'];
        const TIER_COLORS = { S:'#ff7eb9', A:'#ff9f7f', B:'#ffdf7f', C:'#b8ff7f', D:'#7fdfff', F:'#b0b0b0' };

        /** 模擬：users 擴充欄位 + game_database 名稱 */
        function mockApiResponse() {
            return {
                user_id: 'demo-user-001',
                display_name: '示範玩家',
                owned_game_ids: ['g_aurora', 'g_catan', 'g_resistance'],
                wishlist_ids: ['g_earth', 'g_zoo'],
                ranking_titles: ['璀璨寶石', '污痕聖杯'],
                games: [
                    { id: 'g_aurora', name: '璀璨寶石', bgg_id: 167791 },
                    { id: 'g_catan', name: '卡坦島', bgg_id: 13 },
                    { id: 'g_resistance', name: '反抗軍', bgg_id: 41114 },
                    { id: 'g_earth', name: 'Earth', bgg_id: 365013 },
                    { id: 'g_zoo', name: '方舟動物園', bgg_id: 342942 }
                ]
            };
        }

        let state = { pool: [], tiers: {}, manual: [] };

        const rowsEl = document.getElementById('tierRows');
        const poolEl = document.getElementById('pool');

        function buildRows() {
            rowsEl.innerHTML = '';
            TIERS.forEach(tid => {
                const row = document.createElement('div');
                row.className = 'tier-row';
                row.innerHTML = `
                    <div class="tier-label" style="background:${TIER_COLORS[tid]}">${tid}</div>
                    <div class="tier-zone" data-tier="${tid}"></div>
                `;
                const zone = row.querySelector('.tier-zone');
                zone.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('drag-target'); });
                zone.addEventListener('dragleave', () => row.classList.remove('drag-target'));
                zone.addEventListener('drop', e => {
                    e.preventDefault();
                    row.classList.remove('drag-target');
                    const id = e.dataTransfer.getData('text/plain');
                    const node = id && document.getElementById(id);
                    if (node) zone.appendChild(node);
                });
                rowsEl.appendChild(row);
            });
        }

        function makeChip(text, extraClass) {
            const id = 'c-' + Math.random().toString(36).slice(2);
            const el = document.createElement('div');
            el.className = 'chip ' + (extraClass || '');
            el.id = id;
            el.textContent = text;
            el.title = text;
            el.draggable = true;
            el.addEventListener('dragstart', e => {
                e.dataTransfer.setData('text/plain', id);
                e.dataTransfer.effectAllowed = 'move';
            });
            return el;
        }

        function renderFromState() {
            poolEl.innerHTML = '';
            state.pool.forEach(t => poolEl.appendChild(makeChip(t, 'meta')));
            state.manual.forEach(t => poolEl.appendChild(makeChip(t, '')));
            TIERS.forEach(tid => {
                const z = rowsEl.querySelector(`[data-tier="${tid}"]`);
                z.innerHTML = '';
                (state.tiers[tid] || []).forEach(t => z.appendChild(makeChip(t, '')));
            });
        }

        function snapshotDomToState() {
            state.pool = [...poolEl.querySelectorAll('.chip.meta')].map(el => el.textContent);
            state.manual = [...poolEl.querySelectorAll('.chip:not(.meta)')].map(el => el.textContent);
            state.tiers = {};
            TIERS.forEach(tid => {
                const z = rowsEl.querySelector(`[data-tier="${tid}"]`);
                state.tiers[tid] = [...z.querySelectorAll('.chip')].map(el => el.textContent);
            });
        }

        document.getElementById('btnMock').addEventListener('click', () => {
            const data = mockApiResponse();
            document.getElementById('jsonPreview').textContent = JSON.stringify(data, null, 2);
            const nameById = Object.fromEntries(data.games.map(g => [g.id, g.name]));
            const poolNames = [
                ...data.owned_game_ids.map(id => nameById[id] || id),
                ...data.wishlist_ids.map(id => nameById[id] || id),
                ...data.ranking_titles
            ];
            state = {
                pool: [...new Set(poolNames)],
                manual: [],
                tiers: { S: [], A: [], B: [], C: [], D: [], F: [] }
            };
            buildRows();
            renderFromState();
        });

        document.getElementById('btnAdd').addEventListener('click', () => {
            const v = document.getElementById('manual').value.trim();
            if (!v) return;
            snapshotDomToState();
            state.manual.push(v);
            document.getElementById('manual').value = '';
            buildRows();
            renderFromState();
        });

        poolEl.addEventListener('dragover', e => e.preventDefault());
        poolEl.addEventListener('drop', e => {
            e.preventDefault();
            const id = e.dataTransfer.getData('text/plain');
            const node = id && document.getElementById(id);
            if (!node) return;
            if (node.classList.contains('meta')) node.className = 'chip meta';
            else node.className = 'chip';
            poolEl.appendChild(node);
        });

        document.getElementById('btnSave').addEventListener('click', () => {
            snapshotDomToState();
            try {
                localStorage.setItem(LS_KEY, JSON.stringify(state));
                alert('已寫入 localStorage：' + LS_KEY);
            } catch (err) {
                alert('存檔失敗：' + err.message);
            }
        });

        document.getElementById('btnLoad').addEventListener('click', () => {
            try {
                const raw = localStorage.getItem(LS_KEY);
                if (!raw) { alert('尚無存檔'); return; }
                state = JSON.parse(raw);
                buildRows();
                renderFromState();
            } catch (err) {
                alert('讀取失敗：' + err.message);
            }
        });

        document.getElementById('btnExport').addEventListener('click', async () => {
            const root = document.getElementById('export-root');
            if (typeof html2canvas !== 'function') { alert('html2canvas 未載入'); return; }
            const canvas = await html2canvas(root, { scale: 2, backgroundColor: '#1e1e2e' });
            const a = document.createElement('a');
            a.download = 'tier-d1-mock.png';
            a.href = canvas.toDataURL('image/png');
            a.click();
        });

        buildRows();
        document.getElementById('jsonPreview').textContent = '{}';
    </script>
</body>
</html>
