<head>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/hourglass-simple.css">
    <style>
        .page-hero-fix {
            color: white;
            padding: 2.5rem 2rem;
            border-radius: 1.25rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        .page-hero-fix h1 { margin: 0 0 0.5rem; font-size: 2rem; font-weight: 700; color: white; background: none; -webkit-text-fill-color: white; }
        .page-hero-fix p { margin: 0; opacity: 0.9; font-size: 1rem; color: white; }
        .test-list-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.25rem;
            max-width: 900px;
            margin: 0 auto 2rem;
        }
        .test-list-card {
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: var(--shadow-md);
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .test-list-card:hover { border-color: var(--primary-color); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        .test-list-card .card-emoji { font-size: 2rem; margin-bottom: 0.5rem; }
        .test-list-card .card-title { font-size: 1.15rem; font-weight: 700; color: var(--text-color); margin-bottom: 0.4rem; }
        .test-list-card .card-desc { font-size: 0.88rem; color: var(--text-light); line-height: 1.5; }
        #test-intro { display: none; text-align: center; max-width: 520px; margin: 0 auto 2rem; }
        #test-intro p { color: var(--text-light); line-height: 1.7; margin-bottom: 1.5rem; }
        .test-start-btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .test-start-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        .test-back-link { display: inline-block; margin-bottom: 1rem; color: var(--text-light); font-size: 0.9rem; cursor: pointer; text-decoration: underline; }
        .test-back-link:hover { color: var(--primary-color); }
        #test-questions { display: none; }
        .test-questions-layout { display: flex; gap: 1.5rem; align-items: flex-start; max-width: 960px; margin: 0 auto; }
        .test-questions-main { flex: 1; min-width: 0; }
        .test-live-result {
            width: 260px; flex-shrink: 0;
            position: sticky; top: 1rem;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 1rem;
            padding: 1rem;
            box-shadow: var(--shadow-sm);
            font-size: 0.85rem;
        }
        .test-live-result h3 { margin: 0 0 0.75rem; font-size: 0.95rem; color: var(--text-light); font-weight: 600; }
        .test-live-result .live-dim { margin-bottom: 0.6rem; }
        .test-live-result .live-dim-label { font-weight: 600; color: var(--text-color); }
        .test-live-result .live-dim-bar { height: 6px; background: var(--border-color); border-radius: 3px; overflow: hidden; margin-top: 0.25rem; }
        .test-live-result .live-dim-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
        .test-live-result .live-type { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border-color); font-weight: 700; color: var(--primary-color); }
        .test-live-result .live-preview { margin-top: 0.5rem; padding: 0.5rem; background: #f0f9ff; border-radius: 0.5rem; color: var(--text-color); font-size: 0.8rem; }
        .test-live-result .live-scores { margin-bottom: 0.5rem; }
        .test-live-result .live-scores span { display: block; margin-bottom: 0.25rem; }
        @media (max-width: 768px) {
            .test-questions-layout { flex-direction: column; }
            .test-live-result { width: 100%; position: static; }
        }
        .test-progress-wrap { margin-bottom: 1.5rem; }
        .test-progress-text { font-size: 0.9rem; color: var(--text-light); margin-bottom: 0.5rem; }
        .test-progress-bar { height: 8px; background: var(--border-color); border-radius: 1rem; overflow: hidden; }
        .test-progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary-color), var(--secondary-color)); border-radius: 1rem; transition: width 0.4s ease; }
        .test-q-card {
            background: var(--card-bg);
            border-radius: 1.25rem;
            padding: 1.75rem;
            box-shadow: var(--shadow-md);
            margin-bottom: 1.5rem;
        }
        .test-q-num { font-size: 0.8rem; font-weight: 600; color: var(--primary-color); margin-bottom: 0.5rem; }
        .test-q-text { font-size: 1.1rem; font-weight: 600; line-height: 1.6; color: var(--text-color); margin-bottom: 1.25rem; }
        .test-options { display: grid; gap: 0.75rem; }
        .test-opt-btn {
            width: 100%;
            padding: 1rem 1.25rem;
            border: 2px solid var(--border-color);
            border-radius: 0.75rem;
            background: var(--card-bg);
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            color: var(--text-color);
            transition: all 0.2s;
        }
        .test-opt-btn:hover { border-color: var(--primary-color); background: #f0f9ff; }
        .test-opt-btn.selected { border-color: var(--primary-color); background: #e0f2fe; color: var(--primary-color); font-weight: 600; }
        .test-next-wrap { margin-top: 1.5rem; }
        .test-next-btn {
            padding: 0.9rem 2rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .test-next-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .test-next-btn:not(:disabled):hover { opacity: 0.95; }
        #test-result { display: none; text-align: center; max-width: 560px; margin: 0 auto; }
        .result-type-badge {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border-radius: 2rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: white;
            margin-bottom: 1rem;
            box-shadow: var(--shadow-md);
        }
        .result-desc {
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.5rem;
            line-height: 1.7;
            color: var(--text-color);
            text-align: left;
        }
        .result-mbti-badge { font-size: 2rem; font-weight: 800; letter-spacing: 0.2em; margin-bottom: 0.75rem; color: var(--primary-color); }
        .result-retry-btn {
            display: inline-block;
            padding: 0.75rem 1.75rem;
            border: 2px solid var(--border-color);
            border-radius: 0.75rem;
            background: transparent;
            color: var(--text-light);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .result-retry-btn:hover { border-color: var(--primary-color); color: var(--primary-color); }
        .result-radar-wrap {
            max-width: 300px;
            margin: 1rem auto 1.5rem;
        }
        .result-radar-wrap .result-radar-svg {
            width: 100%;
            height: auto;
            display: block;
            aspect-ratio: 1;
        }
        /* 6 軸結果：發散條（以中立 6 為中心） */
        .pref-div-row { display: grid; grid-template-columns: 56px 1fr; gap: 0.65rem; align-items: center; width: 100%; }
        .pref-div-label { font-size: 0.85rem; font-weight: 700; color: var(--text-color); }
        .pref-div-wrap { position: relative; height: 16px; width: 100%; border-radius: 999px; background: var(--bg-light); border: 1px solid var(--border-color); overflow: hidden; }
        .pref-div-wrap.endsOverlay { height: 22px; }
        .pref-div-mid { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: rgba(148,163,184,0.85); transform: translateX(-1px); z-index: 2; pointer-events: none; }
        /* 延伸軌 −3～15、寬 6 膠囊（preference-axis-capsule.js） */
        .pref-capsule { position: absolute; top: 0; bottom: 0; border-radius: 999px; z-index: 1; overflow: hidden; pointer-events: none; }
        .pref-capsule-inner { width: 100%; height: 100%; }
        .pref-div-bar-with-ends { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0.55rem; align-items: center; }
        .pref-div-end { color: var(--text-light); font-weight: 700; font-size: 0.85rem; white-space: nowrap; }
        .pref-div-end.left.active { color: var(--primary-color); }
        .pref-div-end.right.active { color: #db2777; }

        /* Layout 17：左右端文字/emoji 疊在 bar 內（貼邊、無外框空隙） */
        .pref-div-endInBar {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 4;
            font-size: 0.78rem;
            font-weight: 900;
            padding: 0.18rem 0.42rem;
            border-radius: 999px;
            white-space: nowrap;
            max-width: 44%;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.01em;
            pointer-events: none;
            border: none;
            background: rgba(148,163,184,0.10);
            color: var(--text-light);
            opacity: 0.9;
        }
        .pref-div-endInBar.left { left: 0px; }
        .pref-div-endInBar.right { right: 0px; }
        .pref-div-endInBar.left.active {
            background: rgba(59,130,246,0.14);
            color: var(--text-color);
        }
        .pref-div-endInBar.right.active {
            background: rgba(236,72,153,0.14);
            color: var(--text-color);
        }
        .pref-div-endInBar.neutralMuted {
            background: rgba(148,163,184,0.10);
            color: var(--text-light);
            opacity: 0.7;
        }
        .pref-div-meta { display: flex; justify-content: space-between; margin-top: 0.25rem; font-size: 0.78rem; color: var(--text-light); gap: 0.5rem; }
        .pref-div-meta strong { color: var(--text-color); font-weight: 800; }
    </style>
</head>

    <div class="container">

    <!-- 加版本號避免舊版快取 -->
    <script src="js/api-base.js?v=20260320"></script>

    <script>
    (function() {
        'use strict';

        // ---------- MBTI 風格（同意/不同意，四維度） ----------
        // 維度：E/I, S/N, T/F, J/P。每題選「同意」給左邊 +1，「不同意」給右邊 +1
        var DIMENSIONS_MBTI = [
            ['E', 'I', '外向', '內向'],
            ['S', 'N', '實感', '直覺'],
            ['T', 'F', '思考', '情感'],
            ['J', 'P', '計劃', '隨性']
        ];
        var QUESTIONS_MBTI = [
            // E/I 維度（6 題）
            { text: '別人經常說我我行我素。', agree: 'I', disagree: 'E' },
            { text: '我喜歡一個人獨處。', agree: 'I', disagree: 'E' },
            { text: '我喜歡成為眾人矚目的焦點。', agree: 'E', disagree: 'I' },
            { text: '聚會時我常是主動找人聊天的那個。', agree: 'E', disagree: 'I' },
            { text: '我比較喜歡小圈子、少數人深聊。', agree: 'I', disagree: 'E' },
            { text: '獨處一陣子後我會想找朋友見面。', agree: 'E', disagree: 'I' },
            // S/N 維度（6 題）
            { text: '比起天馬行空，我更喜歡具體的事實。', agree: 'S', disagree: 'N' },
            { text: '我很容易被新的可能性與點子吸引。', agree: 'N', disagree: 'S' },
            { text: '我重視實際經驗與親身嘗試。', agree: 'S', disagree: 'N' },
            { text: '我常會想像「如果……會怎樣」的各種可能。', agree: 'N', disagree: 'S' },
            { text: '做決定時我比較依賴過去的經驗與數據。', agree: 'S', disagree: 'N' },
            { text: '我對抽象概念與符號意義很有興趣。', agree: 'N', disagree: 'S' },
            // T/F 維度（6 題）
            { text: '我擅長體會對方的心情。', agree: 'F', disagree: 'T' },
            { text: '為事物下決斷時，我重視數據與資料。', agree: 'T', disagree: 'F' },
            { text: '別人總是覺得我冷淡。', agree: 'T', disagree: 'F' },
            { text: '做決定時我優先考慮「這樣合理嗎」。', agree: 'T', disagree: 'F' },
            { text: '我常會顧慮別人的感受再說話。', agree: 'F', disagree: 'T' },
            { text: '我認為公平與邏輯比和諧更重要。', agree: 'T', disagree: 'F' },
            // J/P 維度（6 題）
            { text: '我很守時，不會遲到。', agree: 'J', disagree: 'P' },
            { text: '我做事喜歡事先規劃好再行動。', agree: 'J', disagree: 'P' },
            { text: '我喜歡彈性、隨興，不愛被行程綁住。', agree: 'P', disagree: 'J' },
            { text: '我喜歡行程表清楚、事先排好。', agree: 'J', disagree: 'P' },
            { text: '臨時改變計劃會讓我有點煩。', agree: 'J', disagree: 'P' },
            { text: '我常常「先做了再說」、邊做邊調整。', agree: 'P', disagree: 'J' }
        ];
        var MBTI_DESCRIPTIONS = {
            INTJ: '建築師：富有想像力與戰略性，一切皆在計劃之中。',
            INTP: '邏輯學家：創新、對知識有不可遏止的渴望。',
            ENTJ: '指揮官：大膽、意志強大的領導者。',
            ENTP: '辯論家：聰明好奇，無法抗拒智力挑戰。',
            INFJ: '提倡者：安靜而神秘，鼓舞人心的理想主義者。',
            INFP: '調停者：詩意、善良的利他主義者。',
            ENFJ: '主人公：富有魅力、鼓舞人心的領導者。',
            ENFP: '競選者：熱情、有創造力、社交能力強。',
            ISTJ: '物流師：實際且注重事實，可靠性高。',
            ISFJ: '守衛者：專注而溫暖的守護者。',
            ESTJ: '總經理：出色的管理者。',
            ESFJ: '執政官：極有同情心、關懷他人。',
            ISTP: '鑑賞家：大膽且實際的實驗者。',
            ISFP: '探險家：靈活且有魅力的藝術家。',
            ESTP: '企業家：聰明、精力充沛、享受刺激。',
            ESFP: '表演者：自發性、熱情的表演者。'
        };

        // ---------- 桌遊偏好（玩家 6 軸，題庫抽 24 題：每軸 4 題） ----------
        // 6 軸：axis_entry, axis_mood, axis_control, axis_openness, axis_sociality, axis_competition
        var PREFERENCE_LABELS = {
            entry: '門檻', mood: '氛圍', control: '勝負（運氣↔策略）',
            openness: '心態（磊落↔心機）', sociality: '互動', competition: '立場（合作↔對抗）'
        };
        // 用於端點文案（Issue #55：避免「左端/右端」含糊不清）
        var PREFERENCE_AXIS_META = {
            entry:       { label: '門檻', left: '🌱 易學', right: '📚 複雜' },
            mood:        { label: '氛圍', left: '😂 歡樂', right: '🧠 燒腦' },
            control:     { label: '勝負', left: '🎲 運氣', right: '♟️ 策略' },
            sociality:   { label: '互動', left: '🗣️ 社交', right: '🧘 自我' },
            openness:    { label: '心態', left: '☀️ 磊落', right: '🎭 心機' },
            competition: { label: '立場', left: '🤝 合作', right: '⚔️ 對抗' }
        };
        var PREFERENCE_GROUPS = { all: ['entry', 'mood', 'control', 'openness', 'sociality', 'competition'] };

        // 題庫：與 demo-axes-player-6axes.html 保持同步（可之後再擴充）

        // 實際測驗時，每次從題庫中：每軸抽 4 題，共 24 題
        function buildPreferenceQuestions() {
            function shuffle(arr) {
                var a = arr.slice();
                for (var i = a.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var t = a[i]; a[i] = a[j]; a[j] = t;
                }
                return a;
            }
            var byAxis = {};
            QUESTIONS_PREFERENCE_BANK.forEach(function(q) {
                byAxis[q.axis] = byAxis[q.axis] || [];
                byAxis[q.axis].push(q);
            });
            var picked = [];
            PREFERENCE_GROUPS.all.forEach(function(axisKey) {
                var list = byAxis[axisKey] || [];
                var shuffled = shuffle(list);
                for (var i = 0; i < Math.min(4, shuffled.length); i++) {
                    picked.push(shuffled[i]);
                }
            });
            // 對 24 題做全局洗牌
            picked = shuffle(picked);

            // 把每題展開成具體選項（左端／中立／右端），並設定對應的 6 軸增減
            return picked.map(function(q) {
                var axisKey = q.axis;
                var w = q.weights[axisKey] || { left: -2, right: 2 };
                var leftText = (q.choices && q.choices.left) ? q.choices.left : (PREFERENCE_AXIS_META[axisKey] ? PREFERENCE_AXIS_META[axisKey].left : '偏左');
                var rightText = (q.choices && q.choices.right) ? q.choices.right : (PREFERENCE_AXIS_META[axisKey] ? PREFERENCE_AXIS_META[axisKey].right : '偏右');
                return {
                    text: q.text,
                    axis: axisKey,
                    options: shuffle([
                        { text: leftText, scores: buildAxisScore(axisKey, w.left) },
                        { text: '兩邊都可以／看情況', scores: {} },
                        { text: rightText, scores: buildAxisScore(axisKey, w.right) }
                    ])
                };
            });
        }

        function buildAxisScore(axisKey, delta) {
            var m = {};
            if (delta > 0) m[axisKey] = delta;
            if (delta < 0) m[axisKey] = delta;
            return m;
        }

        // ---------- 測驗設定 ----------
        var TEST_CONFIG = {
            mbti: {
                name: 'MBTI 風格',
                shortDesc: '24 題「同意／不同意」，得出四維度（外向/內向、實感/直覺、思考/情感、計劃/隨性）組成的類型。',
                questions: QUESTIONS_MBTI,
                resultType: 'mbti'
            },
            preference: {
                name: '桌遊偏好',
                shortDesc: '24 題，玩家 6 軸（門檻、氛圍、勝負、互動、心態、立場），題庫隨機抽題，產出 6 條對立滑桿。',
                questions: [], // 實際題目由 buildPreferenceQuestions() 動態產生
                resultType: 'preference'
            }
        };

        var state = { testId: null, scores: {}, dimensionScores: { E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0 }, currentIndex: 0, selectedIndex: -1 };
        var elList = document.getElementById('test-list');
        var elIntro = document.getElementById('test-intro');
        var elIntroDesc = document.getElementById('intro-desc');
        var elQuestions = document.getElementById('test-questions');
        var elResult = document.getElementById('test-result');
        var elProgressText = document.getElementById('progress-text');
        var elProgressFill = document.getElementById('progress-fill');
        var elQNum = document.getElementById('q-num');
        var elQText = document.getElementById('q-text');
        var elQOptions = document.getElementById('q-options');
        var elBtnNext = document.getElementById('btn-next');
        var elResultEmoji = document.getElementById('result-emoji');
        var elResultMbtiBadge = document.getElementById('result-mbti-badge');
        var elResultTypeName = document.getElementById('result-type-name');
        var elResultDesc = document.getElementById('result-desc');

        function shuffleArray(arr) {
            var a = arr.slice();
            for (var i = a.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var t = a[i]; a[i] = a[j]; a[j] = t;
            }
            return a;
        }

        function getCurrentQuestions() {
            var c = TEST_CONFIG[state.testId];
            if (!c) return [];
            if (c.resultType === 'mbti') return c.questions;
            if (c.resultType === 'preference' && state.preferenceQuestions) {
                return state.preferenceQuestions;
            }
            return [];
        }

        function getTotalQuestions() {
            return getCurrentQuestions().length;
        }

        function showList() {
            state.testId = null;
            elList.style.display = 'block';
            elIntro.style.display = 'none';
            elQuestions.style.display = 'none';
            elResult.style.display = 'none';
        }

        // 若網址帶 ?test=mbti 或 ?test=preference，直接進入該測驗開場
        (function checkUrlTest() {
            var params = new URLSearchParams(window.location.search);
            var t = params.get('test');
            if (t === 'mbti' || t === 'preference') {
                showIntro(t);
            }
        })();

        function showIntro(testId) {
            state.testId = testId;
            state.scores = {};
            state.dimensionScores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
            state.currentIndex = 0;
            state.selectedIndex = -1;
            state.preferenceQuestions = null;
            var c = TEST_CONFIG[testId];
            if (c && c.resultType === 'preference') {
                state.preferenceQuestions = buildPreferenceQuestions();
            }
            elIntroDesc.textContent = c.shortDesc;
            elList.style.display = 'none';
            elIntro.style.display = 'block';
            elQuestions.style.display = 'none';
            elResult.style.display = 'none';
        }

        function showQuestions() {
            elList.style.display = 'none';
            elIntro.style.display = 'none';
            elQuestions.style.display = 'block';
            elResult.style.display = 'none';
            renderQuestion();
            updateLiveResult();
        }

        function getMbtiCode(d) {
            return (d.E >= d.I ? 'E' : 'I') + (d.S >= d.N ? 'S' : 'N') + (d.T >= d.F ? 'T' : 'F') + (d.J >= d.P ? 'J' : 'P');
        }

        function updateLiveResult() {
            var panel = document.getElementById('live-result-content');
            if (!panel) return;
            var c = TEST_CONFIG[state.testId];
            if (!c) { panel.innerHTML = ''; return; }

            var questions = getCurrentQuestions();
            var q = questions[state.currentIndex];
            var html = '';

            if (c.resultType === 'mbti') {
                var d = state.dimensionScores;
                // 若已選此題，顯示「若選此選項」的預測
                if (q && state.selectedIndex >= 0) {
                    var hypo = { E: d.E, I: d.I, S: d.S, N: d.N, T: d.T, F: d.F, J: d.J, P: d.P };
                    if (state.selectedIndex === 0) hypo[q.agree]++;
                    else hypo[q.disagree]++;
                    var code = getMbtiCode(hypo);
                    html += '<div class="live-preview">此題選「' + (state.selectedIndex === 0 ? '同意' : '不同意') + '」→ 預測類型：<strong>' + code + '</strong></div>';
                }
                DIMENSIONS_MBTI.forEach(function(dim) {
                    var left = dim[0], right = dim[1], leftName = dim[2], rightName = dim[3];
                    var lv = d[left] || 0, rv = d[right] || 0;
                    var total = lv + rv || 1;
                    var pctLeft = (lv / total) * 100;
                    html += '<div class="live-dim"><span class="live-dim-label">' + leftName + ' ' + lv + ' : ' + rv + ' ' + rightName + '</span>';
                    html += '<div class="live-dim-bar"><div class="live-dim-fill" style="width:' + pctLeft + '%;background:var(--primary-color);"></div></div></div>';
                });
                var code = getMbtiCode(d);
                html += '<div class="live-type">目前預測：' + code + '</div>';
            } else if (c.resultType === 'preference') {
                var scores = state.scores;
                var keys = PREFERENCE_GROUPS.all;
                var parts = [];
                keys.forEach(function(k) {
                    var raw = scores[k] || 0;
                    var mapped = mapAxisScoreTo012(raw);
                    parts.push(PREFERENCE_LABELS[k] + ' ' + mapped);
                });
                if (parts.length) html += '<div class="live-scores"><span class="live-dim-label">目前估計（0–12）</span> ' + parts.join('、') + '</div>';
            }
            panel.innerHTML = html;
        }

        function addScores(types) {
            Object.keys(types).forEach(function(k) {
                state.scores[k] = (state.scores[k] || 0) + types[k];
            });
        }

        function renderQuestion() {
            var questions = getCurrentQuestions();
            var total = questions.length;
            var q = questions[state.currentIndex];
            var pct = ((state.currentIndex + 1) / total) * 100;
            elProgressText.textContent = '第 ' + (state.currentIndex + 1) + ' / ' + total + ' 題';
            elProgressFill.style.width = pct + '%';
            elQNum.textContent = '題目 ' + (state.currentIndex + 1);
            elQText.textContent = q.text;
            elQOptions.innerHTML = '';
            state.selectedIndex = -1;
            elBtnNext.disabled = true;

            var c = TEST_CONFIG[state.testId];
            if (c.resultType === 'mbti') {
                var agreeBtn = document.createElement('button');
                agreeBtn.type = 'button';
                agreeBtn.className = 'test-opt-btn';
                agreeBtn.textContent = '同意';
                agreeBtn.dataset.choice = 'agree';
                var disBtn = document.createElement('button');
                disBtn.type = 'button';
                disBtn.className = 'test-opt-btn';
                disBtn.textContent = '不同意';
                disBtn.dataset.choice = 'disagree';
                [agreeBtn, disBtn].forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        elQOptions.querySelectorAll('.test-opt-btn').forEach(function(b) { b.classList.remove('selected'); });
                        btn.classList.add('selected');
                        state.selectedIndex = btn.dataset.choice === 'agree' ? 0 : 1;
                        elBtnNext.disabled = false;
                        updateLiveResult();
                    });
                    elQOptions.appendChild(btn);
                });
            } else {
                q.options.forEach(function(opt, i) {
                    var btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'test-opt-btn';
                    btn.textContent = opt.text;
                    btn.dataset.index = i;
                    btn.addEventListener('click', function() {
                        elQOptions.querySelectorAll('.test-opt-btn').forEach(function(b) { b.classList.remove('selected'); });
                        btn.classList.add('selected');
                        state.selectedIndex = i;
                        elBtnNext.disabled = false;
                        updateLiveResult();
                    });
                    elQOptions.appendChild(btn);
                });
            }
            updateLiveResult();
        }

        function nextQuestion() {
            var questions = getCurrentQuestions();
            var q = questions[state.currentIndex];
            var c = TEST_CONFIG[state.testId];

            if (c.resultType === 'mbti') {
                if (state.selectedIndex === 0) state.dimensionScores[q.agree]++;
                else state.dimensionScores[q.disagree]++;
            } else {
                var chosen = q.options[state.selectedIndex];
                if (c.resultType === 'preference' && chosen.scores) addScores(chosen.scores);
                else if (chosen.types) addScores(chosen.types);
            }

            state.currentIndex++;
            if (state.currentIndex >= questions.length) {
                showResult();
            } else {
                renderQuestion();
            }
        }

        function mapAxisScoreTo012(raw) {
            // 題目設計：每軸 4 題，每題 -3/0/+3 → 範圍約 -12..+12，線性壓成 0..12
            if (raw == null || isNaN(raw)) return 6;
            var v = Number(raw);
            var mapped = (v + 12) * 0.5; // (-12 → 0, 0 → 6, 12 → 12)
            if (mapped < 0) mapped = 0;
            if (mapped > 12) mapped = 12;
            return Math.round(mapped);
        }

        function buildPreferenceSliders(scores) {
            var P = window.PreferenceAxisCapsule;
            var html = '<div style="display:flex;flex-direction:column;gap:0.6rem;margin-top:0.75rem;width:100%;align-items:stretch;">';
            PREFERENCE_GROUPS.all.forEach(function(axisKey) {
                var a = PREFERENCE_AXIS_META[axisKey] || { label: PREFERENCE_LABELS[axisKey] || axisKey, left: '左端', right: '右端' };
                var v = mapAxisScoreTo012(scores[axisKey] || 0);
                var delta = v - 6;
                var side = delta < 0 ? 'left' : (delta > 0 ? 'right' : 'neutral');
                var leftEndClass = 'pref-div-endInBar left ' + (side === 'left' ? 'active' : 'neutralMuted');
                var rightEndClass = 'pref-div-endInBar right ' + (side === 'right' ? 'active' : 'neutralMuted');
                var capHtml = '';
                if (P) {
                    var pos = P.capsulePositionPercent(v);
                    var bg = P.capsuleGradientPreferenceBar(v);
                    capHtml = '<div class="pref-capsule" style="left:' + pos.leftPct + '%;width:' + pos.widthPct + '%">' +
                        '<div class="pref-capsule-inner" style="background:' + bg + '"></div></div>';
                }
                html += '' +
                    '<div style="display:flex;flex-direction:column;gap:0.25rem;">' +
                      '<div class="pref-div-row">' +
                        '<div class="pref-div-label">' + a.label + '</div>' +
                        '<div>' +
                          '<div class="pref-div-wrap endsOverlay" role="img" aria-label="' + a.label + ' ' + v + ' / 12">' +
                              '<div class="pref-div-mid"></div>' +
                              capHtml +
                              '<div class="' + leftEndClass + '">' + a.left + '</div>' +
                              '<div class="' + rightEndClass + '">' + a.right + '</div>' +
                          '</div>' +
                        '</div>' +
                      '</div>' +
                    '</div>';
            });
            html += '</div>';
            return html;
        }

        function showResult() {
            elList.style.display = 'none';
            elIntro.style.display = 'none';
            elQuestions.style.display = 'none';
            elResult.style.display = 'block';
            elResultEmoji.style.display = '';
            elResultMbtiBadge.style.display = 'none';
            elResultTypeName.style.display = '';
            var elRadarWrap = document.getElementById('result-radar-wrap');
            if (elRadarWrap) elRadarWrap.style.display = 'none';

            var c = TEST_CONFIG[state.testId];
            if (c.resultType === 'mbti') {
                var d = state.dimensionScores;
                var code = (d.E >= d.I ? 'E' : 'I') + (d.S >= d.N ? 'S' : 'N') + (d.T >= d.F ? 'T' : 'F') + (d.J >= d.P ? 'J' : 'P');
                var desc = MBTI_DESCRIPTIONS[code] || '你的類型是 ' + code + '。';
                elResultEmoji.style.display = 'none';
                elResultMbtiBadge.style.display = 'block';
                elResultMbtiBadge.textContent = code;
                elResultTypeName.style.display = 'none';
                elResultDesc.style.display = 'block';
                elResultDesc.textContent = desc;
            } else if (c.resultType === 'preference') {
                var scores = state.scores;
                elResultEmoji.style.display = 'none';
                elResultMbtiBadge.style.display = 'none';
                elResultTypeName.textContent = '你的桌遊偏好輪廓';
                elResultTypeName.style.background = 'linear-gradient(135deg, #059669, #047857)';
                elResultTypeName.style.display = 'inline-block';
                elResultDesc.style.display = 'none';
                if (elRadarWrap) {
                    elRadarWrap.innerHTML = buildPreferenceSliders(scores);
                    elRadarWrap.style.display = 'block';
                }
            }
            // 顯示/隱藏「儲存到我的檔案」（僅登入顯示按鈕）
            var saveWrap = document.getElementById('result-save-wrap');
            var saveHint = document.getElementById('result-save-hint');
            if (saveWrap && saveHint) {
                var currentUser = typeof getCurrentUser === 'function' ? getCurrentUser() : null;
                if (currentUser && currentUser.id) {
                    saveWrap.style.display = 'block';
                    saveHint.style.display = 'none';
                } else {
                    saveWrap.style.display = 'none';
                    saveHint.style.display = 'block';
                }
            }
        }

        function startTest() {
            showQuestions();
        }

        function retry() {
            showIntro(state.testId);
        }

        function saveToProfile() {
            var user = typeof getCurrentUser === 'function' ? getCurrentUser() : null;
            if (!user || !user.id) {
                alert('請先登入後再儲存');
                return;
            }
            var c = TEST_CONFIG[state.testId];
            if (!c) return;
            var btn = document.getElementById('btn-save-profile');
            if (btn) btn.disabled = true;
            var done = function(msg, isErr) {
                if (btn) btn.disabled = false;
                alert(msg);
            };
            function errMsg(e) {
                var msg = (e && e.message) ? e.message : '請稍後再試';
                if (msg.indexOf('儲存失敗') === -1) return '儲存失敗：' + msg;
                return msg;
            }
            if (c.resultType === 'mbti') {
                var code = getMbtiCode(state.dimensionScores);
                updateUser(user.id, { mbti_type: code }).then(function() {
                    done('已將 MBTI 類型 ' + code + ' 儲存到我的檔案');
                }).catch(function(e) {
                    done(errMsg(e) + '（若持續失敗請檢查網路或重新登入）', true);
                });
                return;
            }
            if (c.resultType === 'preference') {
                var scores = state.scores || {};
                var body = {
                    user_id: user.id,
                    axis_entry: mapAxisScoreTo012(scores.entry || 0),
                    axis_mood: mapAxisScoreTo012(scores.mood || 0),
                    axis_control: mapAxisScoreTo012(scores.control || 0),
                    axis_openness: mapAxisScoreTo012(scores.openness || 0),
                    axis_sociality: mapAxisScoreTo012(scores.sociality || 0),
                    axis_competition: mapAxisScoreTo012(scores.competition || 0)
                };
                var headers = typeof getAuthHeaders === 'function' ? getAuthHeaders() : { 'Content-Type': 'application/json' };
                fetch('tables/user_preference_profiles/' + user.id, { method: 'GET', headers: headers })
                    .then(function(r) {
                        var method = r.status === 404 ? 'POST' : 'PUT';
                        var url = method === 'POST' ? 'tables/user_preference_profiles' : 'tables/user_preference_profiles/' + user.id;
                        return fetch(url, { method: method, headers: headers, body: JSON.stringify(body) });
                    })
                    .then(function(r) {
                        if (r.ok) {
                            done('已將桌遊偏好儲存到我的檔案');
                            return;
                        }
                        return r.text().then(function(t) {
                            var detail = (t && t.length < 200) ? t : (r.status + ' ' + (r.statusText || ''));
                            throw new Error('儲存失敗：' + detail);
                        });
                    })
                    .catch(function(e) {
                        done(errMsg(e) + '（若持續失敗請檢查網路或重新登入）', true);
                    });
            }
        }

        document.querySelectorAll('.test-list-card').forEach(function(card) {
            card.addEventListener('click', function() {
                showIntro(card.dataset.test);
            });
        });
        document.getElementById('btn-start').addEventListener('click', startTest);
        document.getElementById('link-back').addEventListener('click', showList);
        document.getElementById('link-back-from-q').addEventListener('click', showList);
        document.getElementById('link-back-from-result').addEventListener('click', showList);
        document.getElementById('btn-next').addEventListener('click', nextQuestion);
        document.getElementById('btn-retry').addEventListener('click', retry);
        var btnSave = document.getElementById('btn-save-profile');
        if (btnSave) btnSave.addEventListener('click', saveToProfile);
    })();
    </script>
</body>
</html>
